[package]
name = "duralade-runtime"
version.workspace = true
edition.workspace = true

[features]
tokio = ["dep:tokio"]

[dependencies]
duralade-language = { path = "../duralade-language" }
duralade-stdlib = { path = "../duralade-stdlib" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync"], optional = true }
tracing = "0.1"
