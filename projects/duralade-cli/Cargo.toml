[package]
name = "duralade-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "duralade"
path = "src/main.rs"

[dependencies]
duralade-language = { path = "../duralade-language" }
duralade-runtime = { path = "../duralade-runtime", features = ["tokio"] }
clap = { version = "4", features = ["derive"] }
serde = "1"
serde_json = "1"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
