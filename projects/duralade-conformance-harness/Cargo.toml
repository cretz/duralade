[package]
name = "duralade-conformance-harness"
version.workspace = true
edition.workspace = true

[dependencies]
duralade-language = { path = "../duralade-language" }
duralade-runtime = { path = "../duralade-runtime", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"

[dev-dependencies]
datatest-stable = "0.3"

[[test]]
name = "conformance"
harness = false
